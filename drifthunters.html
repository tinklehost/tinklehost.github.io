    <style>
      /* === INTRO OVERLAY === */
      body.intro-active { overflow: hidden; }

      #intro-screen {
          position: fixed;
          inset: 0;
          background-color: #414141;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 99999;
          transition: opacity 0.7s ease, visibility 0.7s ease;
      }

      #intro-screen.hidden-intro {
          opacity: 0;
          visibility: hidden;
      }

      #intro-logo-wrapper {
          display: flex;
          flex-direction: column;
          align-items: center;
          animation: fadeIn 1s ease-out forwards;
      }

      #intro-title {
          font-family: "Orbitron", sans-serif;
          font-size: 42px;
          font-weight: 700;
          letter-spacing: 3px;
          margin-bottom: 20px;
          background: linear-gradient(90deg, #d3a410, #b7870f, #ffe4a1);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 8px rgba(211,165,16,0.4));
          opacity: 0;
          animation: titleFade 1s ease forwards 0.4s;
      }

      @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
      @keyframes titleFade { from { opacity:0; transform:translateY(-12px);} to{opacity:1; transform:translateY(0);} }

      /* SVG animations */
      @keyframes bounce { 0%,100%{ translate:0px 36px; } 50%{ translate:0px 46px; } }
      @keyframes bounce2 { 0%,100%{ translate:0px 46px; } 50%{ translate:0px 56px; } }
      @keyframes umbral { 0%{ stop-color:#d3a5102e; } 50%{ stop-color:rgba(211,165,16,0.519); } 100%{ stop-color:#d3a5102e; } }
      @keyframes particles { 0%,100%{ translate:0px 16px; } 50%{ translate:0px 6px; } }

      #particles { animation: particles 4s ease-in-out infinite; }
      #animatedStop { animation: umbral 4s infinite; }
      #bounce { animation: bounce 4s ease-in-out infinite; translate:0px 36px; }
      #bounce2 { animation: bounce2 4s ease-in-out infinite; translate:0px 46px; animation-delay:0.5s; }
      
      /* Original styles */
      body {
      margin: 0;
      padding: 0;
      }
      .webgl-content * {
      border: 0;
      margin: 0;
      padding: 0;
      }
      .webgl-content {
      position: absolute;
      }
      .webgl-content,
      #gameContainer,
      #unityContainer,
      canvas {
      width: 100% !important;
      height: 100% !important;
      }
      .webgl-content .logo,
      .progress {
      position: absolute;
      left: 50%;
      top: 50%;
      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      }
      .webgl-content .logo {
      background: url("progressLogo.Light.png") no-repeat center/contain;
      width: 354px;
      height: 130px;
      }
      .webgl-content .progress {
      height: 18px;
      width: 141px;
      margin-top: 90px;
      }
      .webgl-content .progress .empty {
      background: url("progressEmpty.Light.png") no-repeat right/cover;
      float: right;
      width: 100%;
      height: 100%;
      display: inline-block;
      }
      .webgl-content .progress .full {
      background: url("progressFull.Light.png") no-repeat left/cover;
      float: left;
      width: 0%;
      height: 100%;
      display: inline-block;
      }
      .webgl-content .logo.Dark {
      background-image: url(progressLogo.Dark.png);
      }
      .webgl-content .progress.Dark .empty {
      background-image: url(progressEmpty.Dark.png);
      }
      .webgl-content .progress.Dark .full {
      background-image: url(progressFull.Dark.png);
      }
      .webgl-content .footer {
      margin-top: 5px;
      height: 38px;
      line-height: 38px;
      font-family: Helvetica, Verdana, Arial, sans-serif;
      font-size: 18px;
      }
      .webgl-content .footer .webgl-logo,
      .title,
      .fullscreen {
      height: 100%;
      display: inline-block;
      background: transparent center no-repeat;
      }
      .webgl-content .footer .webgl-logo {

      .webgl-content .footer .title {

      float: right;
      }

      width: 38px;
      float: right;

          document.body.classList.remove("intro-active");
          setTimeout(() => intro.remove(), 800);
        }
      }

      // Show intro for ~2 seconds
