  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #gameContainer {
      width: 100vw;
      height: 100vh;
      display: block;
      margin: 0 auto;
      position: absolute;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }
    
    /* === INTRO OVERLAY === */
    body.intro-active { overflow: hidden; }

    #intro-screen {
        position: fixed;
        inset: 0;
        background-color: #414141;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    #intro-screen.hidden-intro {
        opacity: 0;
        visibility: hidden;
    }

    #intro-logo-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fadeIn 1s ease-out forwards;
    }

    #intro-title {
        font-family: "Orbitron", sans-serif;
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 3px;
        margin-bottom: 20px;
        background: linear-gradient(90deg, #d3a410, #b7870f, #ffe4a1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 8px rgba(211,165,16,0.4));
        opacity: 0;
        animation: titleFade 1s ease forwards 0.4s;
    }

    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes titleFade { from { opacity:0; transform:translateY(-12px);} to{opacity:1; transform:translateY(0);} }

    /* SVG animations */
    @keyframes bounce { 0%,100%{ translate:0px 36px; } 50%{ translate:0px 46px; } }
    @keyframes bounce2 { 0%,100%{ translate:0px 46px; } 50%{ translate:0px 56px; } }
    @keyframes umbral { 0%{ stop-color:#d3a5102e; } 50%{ stop-color:rgba(211,165,16,0.519); } 100%{ stop-color:#d3a5102e; } }
    @keyframes particles { 0%,100%{ translate:0px 16px; } 50%{ translate:0px 6px; } }

    #particles { animation: particles 4s ease-in-out infinite; }
    #animatedStop { animation: umbral 4s infinite; }
    #bounce { animation: bounce 4s ease-in-out infinite; translate:0px 36px; }
    #bounce2 { animation: bounce2 4s ease-in-out infinite; translate:0px 46px; animation-delay:0.5s; }
    
    /* Loading text */
    #loading-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      font-family: Arial, sans-serif;
      z-index: 1000;
      display: none;
    }
    
    #loading-text.visible {
      display: block;
    }
  </style>
</head>

  <script>
    // === INTRO FADE-OUT ===
    function hideIntro() {
      const intro = document.getElementById("intro-screen");
      if (intro) {
        intro.classList.add("hidden-intro");
        document.body.classList.remove("intro-active");
        setTimeout(() => intro.remove(), 800);
      }
    }

    // Show intro for ~2 seconds
    setTimeout(hideIntro, 2000);
    
    // Show loading text after intro
    setTimeout(() => {
      const loadingText = document.getElementById("loading-text");
      if (loadingText) {
        loadingText.classList.add("visible");
      }
    }, 800);
  </script>

  <script src="Build/UnityLoader.js" type="8b0564566a358200863a102b-text/javascript"></script>
  <script>
    // Modified functions for your Rolling Sky loader
    function mergeFiles(fileParts) {
      return new Promise((resolve, reject) => {
        let buffers = [];
        function fetchPart(i) {
          if (i >= fileParts.length) {
            let mergedBlob = new Blob(buffers);
            let mergedUrl = URL.createObjectURL(mergedBlob);
            resolve(mergedUrl);
            return;
          }
          fetch(fileParts[i])
            .then(r => r.arrayBuffer())
            .then(data => {
              buffers.push(data);
              fetchPart(i + 1);
            })
            .catch(reject);
        }
        fetchPart(0);
      });
    }

    function getParts(file, start, end) {
      let arr = [];
      for (let i = start; i <= end; i++) {
        arr.push(file + ".part" + i);
      }
      return arr;
    }

    function resizeUnityContainer() {
      var container = document.getElementById("gameContainer");
      container.style.width = window.innerWidth + "px";
      container.style.height = window.innerHeight + "px";
      
      // Also resize canvas if it exists
      const canvas = container.querySelector("canvas");
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
      }
    }

    window.addEventListener('resize', resizeUnityContainer);

    function UnityProgress(gameInstance, progress) {
      try {
        if (progress === 'complete') {
          return;
        }
        var pct = 0;
        if (typeof progress === 'number') pct = progress;
        else if (progress && progress.loaded && progress.total) pct = progress.loaded / progress.total;
        var txt = document.getElementById('loading-text');
        if (txt) txt.textContent = 'Loading... ' + Math.round(pct * 100) + '%';
      } catch (e) {
        console.log("Progress error:", e);
      }
    }

    // ---- MAIN LOADER ----
    window.addEventListener("load", function () {
      // Start loading after intro
      setTimeout(() => {
        fetch("Build/WebGL.json")
          .then(r => r.json())
          .then(config => {
            return Promise.all([
              mergeFiles(getParts("Build/WebGL.data.unityweb", 1, 1)),
              mergeFiles(getParts("Build/WebGL.asm.code.unityweb", 1, 2)), 
              mergeFiles(getParts("Build/WebGL.asm.memory.unityweb", 1, 1)), 
              mergeFiles(getParts("Build/WebGL.asm.framework.unityweb", 1, 1)) 
            ]).then(([dataUrl, asmCodeUrl, asmMemoryUrl, asmFrameworkUrl]) => {
              config.dataUrl = dataUrl;
              config.asmCodeUrl = asmCodeUrl;
              config.asmMemoryUrl = asmMemoryUrl;
              config.asmFrameworkUrl = asmFrameworkUrl;

              let blob = new Blob([JSON.stringify(config)], { type: "application/json" });
              let blobUrl = URL.createObjectURL(blob);

              window.gameInstance = UnityLoader.instantiate("gameContainer", blobUrl, {
                onProgress: UnityProgress,
                Module: {
                  onRuntimeInitialized: function () {
                    resizeUnityContainer();
                    let loadingText = document.querySelector("#loading-text");
                    if (loadingText) loadingText.remove();
                    UnityProgress(window.gameInstance, 'complete');
                    
                    // Ensure canvas is properly sized
                    setTimeout(resizeUnityContainer, 100);
                  }
                }
              });
            });
          })
          .catch(err => {
            console.error("Unity load failed:", err);
            const loadingText = document.getElementById("loading-text");
            if (loadingText) {
              loadingText.textContent = "Loading failed. Please refresh.";
            }
          });
      }, 800); // Wait for intro to finish fading out
    });
  </script>
</body>
