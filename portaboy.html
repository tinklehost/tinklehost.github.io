        <script>
            // === INTRO FADE-OUT ===
            function hideIntro() {
                const intro = document.getElementById("intro-screen");
                if (intro) {
                    intro.classList.add("hidden-intro");
                    document.body.classList.remove("intro-active");
                    setTimeout(() => intro.remove(), 800);
                }
            }
            
            // Show intro for ~2 seconds
            setTimeout(hideIntro, 2000);
            
            // Resize canvas for fullscreen experience
            function resizeCanvas() {
                const canvas = document.getElementById('canvas');
                const container = document.getElementById('gm4html5_div_id');
                
                if (canvas && container) {
                    // Get viewport dimensions
                    const viewportWidth = window.innerWidth;
                    const viewportHeight = window.innerHeight;
                    
                    // Calculate aspect ratios
                    const canvasAspect = 1280 / 720; // 16:9
                    const viewportAspect = viewportWidth / viewportHeight;
                    
                    let newWidth, newHeight;
                    
                    if (viewportAspect > canvasAspect) {
                        // Viewport is wider than canvas
                        newHeight = viewportHeight;
                        newWidth = newHeight * canvasAspect;
                    } else {
                        // Viewport is taller than canvas
                        newWidth = viewportWidth;
                        newHeight = newWidth / canvasAspect;
                    }
                    
                    // Apply new dimensions
                    canvas.style.width = newWidth + 'px';
                    canvas.style.height = newHeight + 'px';
                    canvas.style.top = '50%';
                    canvas.style.left = '50%';
                    canvas.style.transform = 'translate(-50%, -50%)';
                    
                    // Also set container to full viewport
                    container.style.width = viewportWidth + 'px';
                    container.style.height = viewportHeight + 'px';
                }
            }
            
            // Initial resize
            window.addEventListener('load', function() {
                resizeCanvas();
                // Call GameMaker initialization after intro
                setTimeout(function() {
                    if (typeof GameMaker_Init === 'function') {
                        GameMaker_Init();
                    }
                }, 800); // Wait for intro fade out
            });
            
            // Resize on window changes
            window.addEventListener('resize', resizeCanvas);
            
            // Handle fullscreen changes
            document.addEventListener('fullscreenchange', resizeCanvas);
            document.addEventListener('webkitfullscreenchange', resizeCanvas);
            document.addEventListener('mozfullscreenchange', resizeCanvas);
            document.addEventListener('MSFullscreenChange', resizeCanvas);
        </script>
