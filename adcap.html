<!doctype html>
<html lang="en-us">
<head>
    <base href="https://rawcdn.githack.com/selenite-cc/selenite-old/9c743188888af0986c8c7b293dbac8f9e421a4ee/adventure-capitalist/">
    <script src="https://tinklehost.github.io/intro.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>Unity WebGL Player | AdVenture Capitalist!</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="/js/all.js"></script>
    <style>
        /* Responsive design - scales to fit screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #231F20;
            overflow: hidden;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .webgl-content {
            position: relative;
            width: min(960px, 95vw);
            height: min(600px, calc(95vw * 0.625)); /* 600/960 = 0.625 aspect ratio */
            max-width: 960px;
            max-height: 600px;
        }
        
        #unityContainer {
            width: 100% !important;
            height: 100% !important;
            position: relative;
            background: rgb(35, 31, 32);
        }
        
        #canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            background: #231F20;
        }
        
        #audio-button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: clamp(12px, 2vw, 16px);
        }
        #audio-button:hover {
            background: #45a049;
        }
        
        #loadingBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(300px, 80%);
            z-index: 10;
        }
        
        #loadingInfo {
            color: white;
            text-align: center;
            font-size: clamp(12px, 2vw, 14px);
        }
    </style>
</head>
<body class="template">
    <div class="webgl-content">
        <button id="audio-button">Enable Audio</button>
        <div id="unityContainer">
            <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" width=960 height=600></canvas>
            
            <div id="loadingBox">
                <div id="bgBar"></div>
                <div id="progressBar"></div>
                <p id="loadingInfo">Loading...</p>
            </div>
            
            <script type='text/javascript'>
                // CRITICAL FIX: Override dlopen at the highest level
                if (typeof window._dlopen === 'undefined') {
                    window._dlopen = function() { 
                        console.log('Global _dlopen stub called');
                        return 1; // Return non-zero for success
                    };
                }
                
                // Override the specific function that's failing
                window.dlopen = window._dlopen;
                
                // Add missing console.logError function
                if (!console.logError) {
                    console.logError = function() {
                        console.error.apply(console, arguments);
                    };
                }

                // FIX: Override XMLHttpRequest to upgrade HTTP to HTTPS
                var originalOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
                    if (typeof url === 'string' && url.startsWith('http://')) {
                        var httpsDomains = ['cdn.hyperhippo.ca', 'hyperhippo.ca'];
                        for (var i = 0; i < httpsDomains.length; i++) {
                            if (url.includes(httpsDomains[i])) {
                                url = url.replace('http://', 'https://');
                                console.log('Upgraded to HTTPS:', url);
                                break;
                            }
                        }
                    }
                    return originalOpen.call(this, method, url, async, user, password);
                };

                // Handle CSSStyleSheet access errors
                var originalCssRules = Object.getOwnPropertyDescriptor(CSSStyleSheet.prototype, 'cssRules');
                if (originalCssRules) {
                    Object.defineProperty(CSSStyleSheet.prototype, 'cssRules', {
                        get: function() {
                            try {
                                return originalCssRules.get.call(this);
                            } catch (e) {
                                return [];
                            }
                        }
                    });
                }

                var originalInsertRule = CSSStyleSheet.prototype.insertRule;
                CSSStyleSheet.prototype.insertRule = function(rule, index) {
                    try {
                        return originalInsertRule.call(this, rule, index);
                    } catch (e) {
                        return 0;
                    }
                };

                // Audio context handling
                window.audioContext = null;
                window.resumeAudio = function() {
                    if (window.audioContext && window.audioContext.state === 'suspended') {
                        window.audioContext.resume();
                    }
                    if (window.Module && window.Module.audioContext) {
                        window.Module.audioContext.resume();
                    }
                };

                document.addEventListener('DOMContentLoaded', function() {
                    document.getElementById('audio-button').addEventListener('click', function() {
                        window.resumeAudio();
                        this.style.display = 'none';
                    });
                });

                // Store audio context when created
                var originalAudioContext = window.AudioContext || window.webkitAudioContext;
                if (originalAudioContext) {
                    window.AudioContext = function() {
                        var ctx = new originalAudioContext();
                        window.audioContext = ctx;
                        return ctx;
                    };
                    window.webkitAudioContext = window.AudioContext;
                }

                // Define Module with comprehensive stubs
                window.Module = {
                    TOTAL_MEMORY: 201326592,
                    filePackagePrefixURL: "Release/",
                    memoryInitializerPrefixURL: "Release/",
                    preRun: [],
                    postRun: [],
                    print: function(text) {
                        console.log(text);
                    },
                    printErr: function(text) {
                        console.error(text);
                    },
                    canvas: document.getElementById('canvas'),
                    progress: null,
                    setStatus: function(text) {
                        if (this.progress == null) {
                            if (typeof UnityProgress != 'function')
                                return;
                            this.progress = new UnityProgress(this.canvas);
                        }
                        if (!this.setStatus.last) this.setStatus.last = {
                            time: Date.now(),
                            text: ''
                        };
                        if (text === this.setStatus.text) return;
                        this.progress.SetMessage(text);
                        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                        if (m)
                            this.progress.SetProgress(parseInt(m[2]) / parseInt(m[4]));
                        if (text === "")
                            this.progress.Clear()
                    },
                    totalDependencies: 0,
                    monitorRunDependencies: function(left) {
                        this.totalDependencies = Math.max(this.totalDependencies, left);
                        this.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
                    },
                    
                    audioContext: null,
                    
                    // CRITICAL: Override _dlopen to return success
                    _dlopen: function() { 
                        console.log('Module._dlopen stub called - returning success');
                        return 1; // Return non-zero for success
                    },
                    _dlsym: function() { 
                        console.log('Module._dlsym stub called');
                        return 0; 
                    },
                    _dlclose: function() { 
                        console.log('Module._dlclose stub called');
                        return 0; 
                    },
                    _JS_Cursor_SetCursorString: function() { return 0; },
                    _JS_Cursor_SetShow: function() { return 0; },
                    _JS_WebRequest_Send: function() { return 0; },
                    
                    // Add any other missing functions
                    _JS_Sound_Play: function() { return 0; },
                    _JS_Sound_Stop: function() { return 0; },
                    _JS_Sound_SetVolume: function() { return 0; }
                };
                
                // Extend Module with asmLibraryArg
                window.Module.asmLibraryArg = window.Module.asmLibraryArg || {};
                var stubs = ['_dlopen', '_dlsym', '_dlclose', '_JS_Cursor_SetCursorString', 
                            '_JS_Cursor_SetShow', '_JS_WebRequest_Send', '_JS_Sound_Play',
                            '_JS_Sound_Stop', '_JS_Sound_SetVolume'];
                stubs.forEach(function(stub) {
                    window.Module.asmLibraryArg[stub] = window.Module[stub];
                });

                window.Module.setStatus('Downloading...');
            </script>
            
            <script src="Release/UnityConfig.js"></script>
            <script src="Release/fileloader.js"></script>
            
            <script>
                // Load webgl.js with interceptors
                (function() {
                    // Override fetch for special events
                    window.fetch = new Proxy(window.fetch, {
                        apply: function(target, thisArg, argumentsList) {
                            var url = argumentsList[0];
                            if (typeof url === 'string' && url.includes('current_events.txt')) {
                                console.log('Returning mock event data');
                                return Promise.resolve(new Response(
                                    JSON.stringify({
                                        currentEvent: {
                                            name: "Standard Event",
                                            multiplier: 1,
                                            startDate: new Date().toISOString(),
                                            endDate: new Date(Date.now() + 7*86400000).toISOString()
                                        }
                                    }),
                                    {
                                        status: 200,
                                        headers: { 'Content-Type': 'application/json' }
                                    }
                                ));
                            }
                            return target.apply(thisArg, argumentsList);
                        }
                    });

                    // Load webgl.js
                    if (!Math.fround) {
                        var codeXHR = new XMLHttpRequest();
                        codeXHR.open('GET', 'Release/webgl.js', true);
                        codeXHR.onload = function() {
                            var code = codeXHR.responseText;
                            
                            // Inject dlopen stub directly into the code
                            code = code.replace(
                                'var Module = typeof Module !== ',
                                '// Injected dlopen stub\n' +
                                'window._dlopen = window._dlopen || function() { return 1; };\n' +
                                'var Module = typeof Module !== '
                            );
                            
                            try {
                                if (!Math.fround) {
                                    var m = /var ([^=]+)=global\.Math\.fround;/.exec(code);
                                    var minified = m[1];
                                    if (minified) {
                                        var startAsm = code.indexOf('// EMSCRIPTEN_START_FUNCS');
                                        var endAsm = code.indexOf('// EMSCRIPTEN_END_FUNCS');
                                        var asm = code.substring(startAsm, endAsm);
                                        do {
                                            var moar = false;
                                            asm = asm.replace(new RegExp('[^a-zA-Z0-9\\$\\_]' + minified + '\\(', 'g'), function(s) {
                                                moar = true;
                                                return s[0] + '('
                                            });
                                        } while (moar);
                                        code = code.substring(0, startAsm) + asm + code.substring(endAsm);
                                        code = code.replace("'use asm'", "'almost asm'");
                                    }
                                }
                            } catch (e) {
                                console.log('Optimization failed: ' + e);
                            }
                            
                            var blob = new Blob([code], { type: 'text/javascript' });
                            var script = document.createElement('script');
                            script.src = URL.createObjectURL(blob);
                            script.onload = function() {
                                URL.revokeObjectURL(script.src);
                                console.log('webgl.js loaded with dlopen stub');
                                
                                // Resume audio on click
                                document.body.addEventListener('click', function() {
                                    if (window.Module && window.Module.audioContext) {
                                        window.Module.audioContext.resume();
                                    }
                                }, { once: true });
                            };
                            document.body.appendChild(script);
                        };
                        codeXHR.send(null);
                    } else {
                        var script = document.createElement('script');
                        script.src = "Release/webgl.js";
                        script.onload = function() {
                            console.log('webgl.js loaded');
                            document.body.addEventListener('click', function() {
                                if (window.Module && window.Module.audioContext) {
                                    window.Module.audioContext.resume();
                                }
                            }, { once: true });
                        };
                        document.body.appendChild(script);
                    }
                })();
            </script>
            
            <script>
                // Final error handler
                window.addEventListener('error', function(e) {
                    if (e.message && e.message.includes('dlopen')) {
                        console.log('Caught dlopen error, providing fallback');
                        window._dlopen = function() { return 1; };
                        return true;
                    }
                    if (e.message && e.message.includes('console.logError')) {
                        console.logError = console.error;
                        return true;
                    }
                });
            </script>
        </div>
    </div>
</body>
</html>
