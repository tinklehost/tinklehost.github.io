<!doctype html>
<html lang="en-us">
<head>
    <base href="https://rawcdn.githack.com/selenite-cc/selenite-old/9c743188888af0986c8c7b293dbac8f9e421a4ee/adventure-capitalist/">
    <script src="https://tinklehost.github.io/intro.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | AdVenture Capitalist!</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="/js/all.js"></script>
    <style>
        .webgl-content {
            position: relative;
        }
        #audio-button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #audio-button:hover {
            background: #45a049;
        }
    </style>
</head>
<body class="template">
    <div class="webgl-content">
        <button id="audio-button">Enable Audio</button>
        <div id="unityContainer" style="width: 960px; height: 600px; padding: 0px; margin: 0px; border: 0px; position: relative; background: rgb(35, 31, 32);">
            <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" width=335 height=667 style="width: 100%; height: 100%; background: #231F20"></canvas>
            
            <div id="loadingBox">
                <div id="bgBar"></div>
                <div id="progressBar"></div>
                <p id="loadingInfo">Loading...</p>
            </div>
            
            <script type='text/javascript'>
                // FIX: Create stubs for dlopen functionality BEFORE Module is defined
                if (typeof window.dlopen === 'undefined') {
                    window.dlopen = function() { 
                        console.log('dlopen stub called');
                        return 0; 
                    };
                    window.dlsym = function() { 
                        console.log('dlsym stub called');
                        return null; 
                    };
                    window.dlclose = function() { 
                        console.log('dlclose stub called');
                        return 0; 
                    };
                    window.dlerror = function() { 
                        return null; 
                    };
                }

                // FIX: Create a global audio context handler
                window.audioContext = null;
                window.resumeAudio = function() {
                    if (window.audioContext && window.audioContext.state === 'suspended') {
                        window.audioContext.resume().then(() => {
                            console.log('AudioContext resumed successfully');
                        });
                    }
                    // Also try to resume any Unity audio contexts
                    if (window.Module && window.Module.audioContext) {
                        window.Module.audioContext.resume();
                    }
                };

                // Add click handler for audio button
                document.addEventListener('DOMContentLoaded', function() {
                    document.getElementById('audio-button').addEventListener('click', function() {
                        window.resumeAudio();
                        this.style.display = 'none';
                    });
                });

                // Store audio context when created
                var originalAudioContext = window.AudioContext || window.webkitAudioContext;
                if (originalAudioContext) {
                    window.AudioContext = function() {
                        var ctx = new originalAudioContext();
                        window.audioContext = ctx;
                        return ctx;
                    };
                    window.webkitAudioContext = window.AudioContext;
                }

                // Connect to canvas - define Module ONCE
                window.Module = {
                    TOTAL_MEMORY: 201326592,
                    filePackagePrefixURL: "Release/",
                    memoryInitializerPrefixURL: "Release/",
                    preRun: [],
                    postRun: [],
                    print: function(text) {
                        console.log(text);
                    },
                    printErr: function(text) {
                        console.error(text);
                    },
                    canvas: document.getElementById('canvas'),
                    progress: null,
                    setStatus: function(text) {
                        if (this.progress == null) {
                            if (typeof UnityProgress != 'function')
                                return;
                            this.progress = new UnityProgress(this.canvas);
                        }
                        if (!this.setStatus.last) this.setStatus.last = {
                            time: Date.now(),
                            text: ''
                        };
                        if (text === this.setStatus.text) return;
                        this.progress.SetMessage(text);
                        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                        if (m)
                            this.progress.SetProgress(parseInt(m[2]) / parseInt(m[4]));
                        if (text === "")
                            this.progress.Clear()
                    },
                    totalDependencies: 0,
                    monitorRunDependencies: function(left) {
                        this.totalDependencies = Math.max(this.totalDependencies, left);
                        this.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
                    },
                    
                    // FIX: Override the audio context to handle autoplay restrictions
                    audioContext: null,
                    
                    // FIX: Add dlopen stubs directly to Module
                    _dlopen: function() {
                        console.log('dlopen called - returning stub success');
                        return 0;
                    },
                    _dlsym: function() {
                        console.log('dlsym called - returning stub success');
                        return 0;
                    },
                    _dlclose: function() {
                        console.log('dlclose called - returning stub success');
                        return 0;
                    }
                };
                
                // Extend Module with asmLibraryArg
                window.Module.asmLibraryArg = window.Module.asmLibraryArg || {};
                window.Module.asmLibraryArg._dlopen = window.Module._dlopen;
                window.Module.asmLibraryArg._dlsym = window.Module._dlsym;
                window.Module.asmLibraryArg._dlclose = window.Module._dlclose;

                window.Module.setStatus('Downloading...');
            </script>
            
            <script src="Release/UnityConfig.js"></script>
            <script src="Release/fileloader.js"></script>
            
            <script>
                // FIX: Single script loading approach
                (function() {
                    // Check if we need the Math.fround optimization
                    if (!Math.fround) {
                        // Need to process the file to remove Math.fround
                        var codeXHR = new XMLHttpRequest();
                        codeXHR.open('GET', 'Release/webgl.js', true);
                        codeXHR.onload = function() {
                            var code = codeXHR.responseText;
                            
                            try {
                                console.log('optimizing out Math.fround calls');
                                var m = /var ([^=]+)=global\.Math\.fround;/.exec(code);
                                var minified = m[1];
                                if (minified) {
                                    var startAsm = code.indexOf('// EMSCRIPTEN_START_FUNCS');
                                    var endAsm = code.indexOf('// EMSCRIPTEN_END_FUNCS');
                                    var asm = code.substring(startAsm, endAsm);
                                    do {
                                        var moar = false;
                                        asm = asm.replace(new RegExp('[^a-zA-Z0-9\\$\\_]' + minified + '\\(', 'g'), function(s) {
                                            moar = true;
                                            return s[0] + '('
                                        });
                                    } while (moar);
                                    code = code.substring(0, startAsm) + asm + code.substring(endAsm);
                                    code = code.replace("'use asm'", "'almost asm'");
                                }
                            } catch (e) {
                                console.log('failed to optimize out Math.fround calls: ' + e);
                            }
                            
                            // Create blob and load
                            var blob = new Blob([code], { type: 'text/javascript' });
                            var script = document.createElement('script');
                            script.src = URL.createObjectURL(blob);
                            script.onload = function() {
                                URL.revokeObjectURL(script.src);
                                console.log('webgl.js loaded with Math.fround optimizations');
                                
                                // Resume audio on first click anywhere
                                document.body.addEventListener('click', function() {
                                    if (window.Module && window.Module.audioContext) {
                                        window.Module.audioContext.resume();
                                    }
                                }, { once: true });
                            };
                            document.body.appendChild(script);
                        };
                        codeXHR.send(null);
                    } else {
                        // Browser supports Math.fround, load normally
                        var script = document.createElement('script');
                        script.src = "Release/webgl.js";
                        script.onload = function() {
                            console.log('webgl.js loaded normally');
                            
                            // Resume audio on first click anywhere
                            document.body.addEventListener('click', function() {
                                if (window.Module && window.Module.audioContext) {
                                    window.Module.audioContext.resume();
                                }
                            }, { once: true });
                        };
                        document.body.appendChild(script);
                    }
                })();
            </script>
        </div>
    </div>
</body>
</html>
