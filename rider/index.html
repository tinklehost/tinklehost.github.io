<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <title>Unity WebGL</title>

  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #unity-container {
      width: 100%;
      height: 100%;
      position: absolute;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>
  <script>
  // Stub YouTube Playables API for non-YT environments
  window.ytgame = {
    SendFirstFrameReady: function () {
      console.log("ytgame.SendFirstFrameReady (stubbed)");
    },
    GameReady: function () {
      console.log("ytgame.GameReady (stubbed)");
    },
    GameOver: function () {
      console.log("ytgame.GameOver (stubbed)");
    }
  };
</script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/WebGL.loader.js";

    const config = {
      dataUrl: buildUrl + "/WebGL.data",
      frameworkUrl: buildUrl + "/WebGL.framework.js",
      codeUrl: buildUrl + "/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets/aa",
      companyName: "Ketchapp",
      productName: "Rider",
      productVersion: "2.22.3.00",
    };

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (progress * 100) + "%";
      }).then(() => {
        loadingBar.style.display = "none";
      }).catch((message) => {
        console.error(message);
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
