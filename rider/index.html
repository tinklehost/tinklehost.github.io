<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Unity WebGL Game</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #unityContainer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <!-- Unity WebGL container -->
  <div id="unityContainer"></div>

  <!-- Stub for YouTube Playables / Unity firstFrameReady -->
  <script>
    // Ensure the YouTube Playables object exists
    window.ytgame = window.ytgame || {};
    ytgame.events = ytgame.events || {};

    // Stub firstFrameReady so Unity doesn't throw
    ytgame.events.firstFrameReady = function() {
      console.log("Unity called firstFrameReady");
    };

    // Optional stubs for other common Unity calls
    ytgame.events.sendStats = function(stats) {
      console.log("sendStats called", stats);
    };
    ytgame.events.sendTelemetry = function(data) {
      console.log("sendTelemetry called", data);
    };
    ytgame.events.sendEvent = function(name, data) {
      console.log("sendEvent called", name, data);
    };
  </script>

  <!-- Unity loader script -->
  <script src="Build/WebGL.loader.js"></script>
  <script>
    const buildUrl = "Build";
    const config = {
      dataUrl: buildUrl + "/data.unity3d",
      frameworkUrl: buildUrl + "/WebGL.framework.js",
      codeUrl: buildUrl + "/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets/aa",
      companyName: "YourCompany",
      productName: "YourGame",
      productVersion: "1.0",
      showBanner: (msg) => console.log(msg)
    };

    // Create Unity instance
    createUnityInstance(document.querySelector("#unityContainer"), config)
      .then((unityInstance) => {
        console.log("Unity loaded successfully");

        // Optional: handle first-frame ready manually
        // unityInstance.SendMessage("YourGameObject", "YourMethod", "param");
      })
      .catch((err) => console.error(err));
  </script>
</body>
</html>
