<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unity WebGL Build</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #000; }
    #unityContainer { width: 100%; height: 100%; position: relative; }
    #youtubeOverlay { position: absolute; top: 10px; right: 10px; width: 320px; height: 180px; z-index: 10; }
  </style>
</head>
<body>

  <div id="unityContainer"></div>
  <!-- Optional YouTube iframe overlay -->
  <div id="youtubeOverlay">
    <iframe width="320" height="180"
      src="https://www.youtube.com/embed/YOUR_VIDEO_ID?autoplay=0"
      frameborder="0" allowfullscreen>
    </iframe>
  </div>

  <script src="Build/WebGL.loader.js"></script>
  <script>
    // Unity configuration
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/WebGL.loader.js";
    const config = {
      dataUrl: buildUrl + "/WebGL.data",
      frameworkUrl: buildUrl + "/WebGL.framework.js",
      codeUrl: buildUrl + "/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "YourCompany",
      productName: "YourProduct",
      productVersion: "1.0",
      devicePixelRatio: window.devicePixelRatio,
      canvas: document.getElementById("unityContainer"),
      matchWebGLToCanvasSize: true,
      // Optional: show a loading bar
      // onProgress: (unityInstance, progress) => { console.log(progress); }
    };

    // Safari WebGL fix
    if (navigator.userAgent.includes("Safari") && !navigator.userAgent.includes("Chrome")) {
      HTMLCanvasElement.prototype.getContextSafariWebGL2Fixed = function(type, attrs) {
        return this.getContext(type, attrs);
      };
      const canvas = config.canvas;
      canvas.fixedGetContext = canvas.getContextSafariWebGL2Fixed.bind(canvas);
    }

    // Load Unity
    createUnityInstance(config.canvas, config)
      .then(unityInstance => {
        console.log("Unity loaded successfully");

        // Resume AudioContext after user gesture
        const resumeAudio = () => {
          const ctx = unityInstance.Module?.audioContext;
          if (ctx && ctx.state === "suspended") ctx.resume();
          window.removeEventListener("click", resumeAudio);
        };
        window.addEventListener("click", resumeAudio);

      })
      .catch(message => {
        console.error("Failed to load Unity:", message);
      });

  </script>
</body>
</html>
