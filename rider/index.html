<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unity WebGL Build</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #000; }
    #unityContainer { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="unityContainer"></div>

  <script src="Build/WebGL.loader.js"></script>
  <script>
    const config = {
      dataUrl: "Build/WebGL.data",
      frameworkUrl: "Build/WebGL.framework.js",
      codeUrl: "Build/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "YourCompany",
      productName: "YourProduct",
      productVersion: "1.0",
      devicePixelRatio: window.devicePixelRatio,
      canvas: document.getElementById("unityContainer"),
      matchWebGLToCanvasSize: true,
    };

    // Safari WebGL fix
    if (navigator.userAgent.includes("Safari") && !navigator.userAgent.includes("Chrome")) {
      HTMLCanvasElement.prototype.getContextSafariWebGL2Fixed = function(type, attrs) {
        return this.getContext(type, attrs);
      };
      const canvas = config.canvas;
      canvas.fixedGetContext = canvas.getContextSafariWebGL2Fixed.bind(canvas);
    }

    // Load Unity
    createUnityInstance(config.canvas, config)
      .then(unityInstance => {
        console.log("Unity loaded successfully");

        // Resume AudioContext on first user gesture
        const resumeAudio = () => {
          const ctx = unityInstance.Module?.audioContext;
          if (ctx && ctx.state === "suspended") ctx.resume();
          window.removeEventListener("click", resumeAudio);
        };
        window.addEventListener("click", resumeAudio);

      })
      .catch(message => {
        console.error("Failed to load Unity:", message);
      });

  </script>
</body>
</html>
