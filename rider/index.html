<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unity WebGL Build</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #unityContainer { width: 100vw; height: 100vh; position: relative; }
    /* Optional YouTube overlay container */
    #youtubeContainer {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 480px;
      height: 270px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="unityContainer"></div>
  <div id="youtubeContainer"></div> <!-- optional for YouTube videos -->

  <script src="Build/WebGL.loader.js"></script>
  <script>
    const buildUrl = "Build"; // folder where your WebGL build files are
    const loaderConfig = {
      dataUrl: buildUrl + "/WebGL.data",
      frameworkUrl: buildUrl + "/WebGL.framework.js",
      codeUrl: buildUrl + "/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "YourCompany",
      productName: "YourProduct",
      productVersion: "1.0",
    };

    const container = document.querySelector("#unityContainer");

    // Create Unity instance
    createUnityInstance(container, loaderConfig).then((unityInstance) => {
      console.log("Unity loaded successfully!");

      // Example: load YouTube iframe inside your overlay
      const youtubeContainer = document.getElementById("youtubeContainer");
      const iframe = document.createElement("iframe");
      iframe.width = "480";
      iframe.height = "270";
      iframe.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";
      iframe.frameBorder = "0";
      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen = true;
      youtubeContainer.appendChild(iframe);

    }).catch((err) => {
      console.error(err);
      alert("Failed to load Unity: " + err);
    });
  </script>
</body>
</html>
