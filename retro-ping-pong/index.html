<!DOCTYPE html>
<html>

<head>
	<script>
(function () {
  console.log("GameDistribution blocker active");

  // Block redirects completely
  let redirectBlocked = false;
  
  // Override location setters
  const locationSetter = function() {
    console.warn("🚫 Blocked redirect attempt");
    return false;
  };
  
  // Block location.href changes
  Object.defineProperty(window, 'location', {
    configurable: false,
    get: function() { return document.location; },
    set: locationSetter
  });
  
  // Block location.replace and assign
  if (window.location) {
    window.location.replace = function() { console.warn("Blocked location.replace"); };
    window.location.assign = function() { console.warn("Blocked location.assign"); };
  }
  
  // Block window.open
  window.open = function() { 
    console.warn("Blocked window.open");
    return null;
  };
  
  // Block meta refresh and redirects
  const originalCreateElement = document.createElement;
  document.createElement = function(tagName) {
    const element = originalCreateElement.call(document, tagName);
    if (tagName.toLowerCase() === 'meta') {
      setTimeout(function() {
        if (element.httpEquiv && element.httpEquiv.toLowerCase() === 'refresh') {
          console.warn("Blocked meta refresh");
          element.parentNode?.removeChild(element);
        }
      }, 0);
    }
    return element;
  };
  
  // Block iframe injections
  new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      mutation.addedNodes.forEach(function(node) {
        if (node.tagName === 'IFRAME') {
          const src = node.src || '';
          if (src.includes('gamedistribution.com') || src.includes('blocked.html')) {
            console.warn("Removed GameDistribution iframe");
            node.remove();
          }
        }
      });
    });
  }).observe(document.documentElement, { childList: true, subtree: true });
  
  // Mock the GameDistribution SDK
  window.gdsdk = {
    showAd: function() { 
      console.log("Ad blocked - continuing game");
      return Promise.resolve();
    },
    isAdBlocked: true
  };
  
  // Block all network requests to GameDistribution
  const originalFetch = window.fetch;
  window.fetch = function(url, options) {
    if (typeof url === 'string' && url.includes('gamedistribution.com')) {
      console.warn("Blocked fetch to:", url);
      return Promise.reject(new Error('Blocked'));
    }
    return originalFetch.call(this, url, options);
  };
  
  // Block XMLHttpRequest to GameDistribution
  const XHR = XMLHttpRequest;
  window.XMLHttpRequest = function() {
    const xhr = new XHR();
    const originalOpen = xhr.open;
    xhr.open = function(method, url) {
      if (typeof url === 'string' && url.includes('gamedistribution.com')) {
        console.warn("Blocked XHR to:", url);
        url = 'about:blank';
      }
      return originalOpen.apply(this, arguments);
    };
    return xhr;
  };
  
  // Override the GameDistribution config to prevent redirects
  window.GD_OPTIONS = {
    gameId: "7a673308bc3b4585b9f70436462c2051",
    onEvent: function(event) {
      console.log("GD Event:", event.name);
      // Handle events but don't let them redirect
      switch(event.name) {
        case "SDK_GAME_START":
          console.log("Game started - ignoring ad completion");
          break;
        case "SDK_GAME_PAUSE":
          console.log("Game paused - ignoring ad start");
          break;
      }
    }
  };
  
  // Prevent script errors from GameDistribution
  window.addEventListener('error', function(e) {
    if (e.filename && e.filename.includes('gamedistribution')) {
      e.preventDefault();
      e.stopPropagation();
      console.warn("Blocked GameDistribution error");
      return false;
    }
  }, true);
  
})();
</script>

<body>
	<div id="game_container"></div>
	<div id="ad-notice">🔇 Ads blocked</div>

	<script type="text/javascript">
		// Original game variables
		let isAdBreakActive = false;
		let wasMuted = false;

		// Modified showAd function that doesn't redirect
		function showAd() {
			console.log('showAd called - blocked locally');
			// Simulate ad completion immediately
			setTimeout(() => {
				try {
					// Trigger the same events as if ad completed
					if (typeof NORD !== 'undefined' && NORD.audioManager) {
						NORD.audioManager.setMute(wasMuted);
					}
					if (typeof TweenMax !== 'undefined') {
						TweenMax.resumeAll();
					}
					isAdBreakActive = false;
					console.log("Simulated ad completion");
				} catch (e) {}
			}, 100); // Short delay to simulate ad
			
			return Promise.resolve();
		}

		// Override any GameDistribution initialization
		window["GD_OPTIONS"] = {
			"gameId": "7a673308bc3b4585b9f70436462c2051",
			"onEvent": function (event) {
				console.log("GameDistribution Event:", event.name);
				switch (event.name) {
					case "SDK_GAME_START":
						isAdBreakActive = false;
						try {
							if (typeof NORD !== 'undefined' && NORD.audioManager) {
								NORD.audioManager.setMute(wasMuted);
							}
							if (typeof TweenMax !== 'undefined') {
								TweenMax.resumeAll();
							}
						} catch (e) { }
						break;

					case "SDK_GAME_PAUSE":
						isAdBreakActive = true;
						try {
							if (typeof NORD !== 'undefined' && NORD.audioManager) {
								wasMuted = NORD.audioManager.isMute;
								NORD.audioManager.setMute(true);
							}
							if (typeof TweenMax !== 'undefined') {
								TweenMax.pauseAll();
							}
						} catch (e) { }
						break;
				}
			}
		};

		// Completely block the GameDistribution script
		const originalScript = document.createElement;
		document.createElement = function(tagName) {
			const element = originalScript.call(document, tagName);
			if (tagName.toLowerCase() === 'script') {
				Object.defineProperty(element, 'src', {
					set: function(value) {
						if (value && value.includes('gamedistribution.com')) {
							console.warn("Blocked GameDistribution script load:", value);
							// Load a mock script instead
							const mockScript = document.createElement('script');
							mockScript.textContent = 'window.gdsdk = { showAd: function() { console.log("Mock ad"); return Promise.resolve(); } };';
							document.head.appendChild(mockScript);
							return;
						}
						// Allow other scripts
						this.setAttribute('src', value);
					},
					get: function() {
						return this.getAttribute('src');
					}
				});
			}
			return element;
		};
	</script>
