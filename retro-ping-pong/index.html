	<script>
(function () {
  console.log("Redirect blocker active");

  // Block window.open
  window.open = function () {
    console.warn("Blocked window.open attempt");
    return null;
  };

  // Block location changes
  const blockNavigation = function () {
    console.warn("Blocked navigation attempt");
    return false;
  };

  // Prevent location.href changes
  Object.defineProperty(window, "location", {
    configurable: false,
    enumerable: true,
    get: function () {
      return document.location;
    },
    set: function () {
      console.warn("Blocked location change");
    }
  });

  // Prevent link clicks from leaving site
  document.addEventListener("click", function (e) {
    let target = e.target.closest("a");
    if (target && target.href && !target.href.includes(location.hostname)) {
      e.preventDefault();
      e.stopPropagation();
      console.warn("Blocked external link:", target.href);
    }
  }, true);

  // Remove injected iframes (common popup method)
  const observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (mutation) {
      mutation.addedNodes.forEach(function (node) {
        if (node.tagName === "IFRAME") {
          console.warn("Removed injected iframe");
          node.remove();
        }
      });
    });
  });

  observer.observe(document.documentElement, {
    childList: true,
    subtree: true
  });

})();
</script>

	<script type="text/javascript">
		let isAdBreakActive = false;
		let wasMuted = false;

		window["GD_OPTIONS"] = {
			"gameId": "7a673308bc3b4585b9f70436462c2051", // REPLACE WITH CORRECT ONE!
			"onEvent": function (event) {
				switch (event.name) {

					case "SDK_GAME_START":
						// advertisement done, resume game logic and unmute audio
						console.log("adBreak Complete")

						isAdBreakActive = false;
						try {
							NORD.audioManager.setMute(wasMuted);
							TweenMax.resumeAll();
						} catch (e) { }

						break;

					case "SDK_GAME_PAUSE":
						// pause game logic / mute audio
						console.log("AdBreak Started")

						isAdBreakActive = true;
						try {
							wasMuted = NORD.audioManager.isMute;
							NORD.audioManager.setMute(true);
							TweenMax.pauseAll();
							setTimeout(() => {
								if (isAdBreakActive) TweenMax.pauseAll();
							}, 1000);
						} catch (e) { }

						break;
				}
			}
		};

		function showAd() {
			console.log('showAd call!');
			try {
				if (typeof gdsdk !== 'undefined' && gdsdk.showAd !== 'undefined') {
					gdsdk.showAd();
				}
			} catch (e) { }
		}
	</script>
